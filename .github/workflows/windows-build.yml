name: Windows build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC x64
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Configuration, process lifecycle and GUI smoke tests
        run: ctest --test-dir build -C Release --output-on-failure --timeout 30
      - name: Verify metadata collector against built executable
        shell: pwsh
        run: |
          ./tools/Collect-Diagnostics.ps1 -GameDirectory ./build/Release -OutputPath ./build/diagnostics.json
          $report = Get-Content ./build/diagnostics.json -Raw | ConvertFrom-Json
          $exe = @($report.BinaryEvidence | Where-Object RelativePath -eq "SlutopiaTrainer.exe")
          if ($exe.Count -ne 1 -or $exe[0].Machine -ne "x64" -or $exe[0].SHA256.Length -ne 64) {
            throw "Collector did not identify the built x64 executable"
          }
      - name: CLI enumeration
        run: .\build\Release\SlutopiaTrainer.exe --list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-logs
          path: build/Testing/Temporary/
      - uses: actions/upload-artifact@v4
        with:
          name: SlutopiaTrainer-windows-x64
          path: build/Release/SlutopiaTrainer.exe
